<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Manager</title>
    <style>
        body {
            font-family: sans-serif;
            box-sizing: border-box;

            .user-container {
                width: min(60%, 100%);
                margin: 0 auto;
            }

            table {
                border-collapse: collapse;
                width: 100%;
                margin-top: 10px;

                thead {
                    th {
                        padding: 10px;
                        background-color: #333;
                        color: #fff;
                    }
                }

                tbody {
                    td {
                        padding: 8px;
                        border-bottom: 1px solid #333;
                    }
                }
            }

            button {
                display: inline-flex;
                justify-content: space-between;
                align-items: center;
                border: none;
                cursor: pointer;
                border-radius: 4px;
                padding: 5px 10px;
            }

            button.primary {
                background-color: #009;
                color: #fff;
            }

            button.danger {
                background-color: #900;
                color: #fff;
            }
        }
    </style>
</head>

<body>
    <div class="user-container">
        <h1>Welcome to User Manager</h1>
        <button class="primary" onclick="showEdit()">
            Add New
        </button>
        <table>
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="users"></tbody>
        </table>
    </div>


    <script>
        async function getUser() {
            const response = await fetch("http://localhost:4000/users");
            const users = await response.json();
            renderUsers(users);
        }

        const renderUsers = (users) => {
            let content = "";
            users.forEach(user => {
                content += `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>
                            <button class="primary">
                                Edit
                            </button>
                            <button class="danger">
                                Remove
                            </button>
                        </td>
                    </tr>
                `;
            });

            //DOM manipulation 
            const tbody = document.getElementById("users");
            tbody.innerHTML = content;
        }

        document.addEventListener("DOMContentLoaded", () => {
            getUser();
        });

    </script>
</body>

</html>
